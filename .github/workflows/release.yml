name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Must run before the Rust build: web/dist is embedded into the binary.
      - name: Build frontend
        run: npm --prefix web ci && npm --prefix web run build

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p reclaim-cli
          else
            cargo build --release --target ${{ matrix.target }} -p reclaim-cli
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="reclaim-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/reclaim" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/" 2>/dev/null || cp README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          shasum -a 256 "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            install.sh
          generate_release_notes: true

  # Update the Homebrew tap to point at the release just published.
  #
  # Requires a TAP_GITHUB_TOKEN secret with write access to
  # github.com/gokul-kulkarni/homebrew-tap. Without it this job is skipped, and
  # the release is still usable via install.sh and `cargo install`.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check for tap credentials
        id: creds
        run: |
          if [ -n "${{ secrets.TAP_GITHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_GITHUB_TOKEN is not set; skipping the Homebrew tap update."
          fi

      - name: Check out the tap
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: gokul-kulkarni/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render the formula
        if: steps.creds.outputs.available == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FORMULA=packaging/homebrew/reclaim.rb

          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/" "$FORMULA"

          # Substitute each placeholder with the checksum of its own artifact,
          # so a missing build fails the release rather than shipping a formula
          # that 404s for one architecture.
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        aarch64-unknown-linux-musl x86_64-unknown-linux-gnu; do
            sum_file="artifacts/reclaim-${target}.tar.gz.sha256"
            test -f "$sum_file" || { echo "missing checksum for ${target}"; exit 1; }
            sha="$(awk '{print $1}' "$sum_file")"
            placeholder="REPLACE_WITH_$(echo "$target" | tr 'a-z-' 'A-Z_')_SHA256"
            sed -i "s/${placeholder}/${sha}/" "$FORMULA"
          done

          if grep -q REPLACE_WITH "$FORMULA"; then
            echo "formula still has unsubstituted placeholders:"; grep REPLACE_WITH "$FORMULA"; exit 1
          fi

          mkdir -p tap/Formula
          cp "$FORMULA" tap/Formula/reclaim.rb

      - name: Commit to the tap
        if: steps.creds.outputs.available == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/reclaim.rb
          git diff --staged --quiet || git commit -m "reclaim ${GITHUB_REF_NAME#v}"
          git push
