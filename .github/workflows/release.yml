name: Release
#
# Builds the two Linux targets and publishes them as a GitHub Release.
#
# macOS targets are deliberately NOT built here. GitHub's macOS runner
# capacity — especially the Intel (x86_64-apple-darwin, macos-13) image — is
# small, and a build queued indefinitely with zero progress rather than
# failing outright or completing (see the aarch64-apple-darwin sibling job,
# which built fine on macos-14 the one time this was tried). Both macOS
# targets cross-compile natively from a single Apple Silicon machine via
# Xcode's own toolchain, so they're built and attached locally instead:
#
#   ./scripts/release-macos.sh v0.1.0   # after this workflow's `publish` job
#                                        # has created the release
#   ./scripts/update-tap.sh 0.1.0       # once all four tarballs are attached

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Must run before the Rust build: web/dist is embedded into the binary.
      - name: Build frontend
        run: npm --prefix web ci && npm --prefix web run build

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p reclaim-cli
          else
            cargo build --release --target ${{ matrix.target }} -p reclaim-cli
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="reclaim-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/reclaim" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/" 2>/dev/null || cp README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          sha256sum "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            install.sh
          generate_release_notes: true
      - name: Next steps
        run: |
          echo "::notice::Linux binaries published. Run ./scripts/release-macos.sh ${GITHUB_REF_NAME} locally to attach the macOS builds, then ./scripts/update-tap.sh ${GITHUB_REF_NAME#v} to update the Homebrew tap."
