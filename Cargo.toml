[workspace]
resolver = "2"
members = [
    "crates/reclaim-core",
    "crates/reclaim-providers",
    "crates/reclaim-web",
    "crates/reclaim-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/gokul-kulkarni/reclaim"
authors = ["Gokul Kulkarni"]

[workspace.dependencies]
reclaim-core = { path = "crates/reclaim-core", version = "0.1.2" }
reclaim-providers = { path = "crates/reclaim-providers", version = "0.1.2" }
reclaim-web = { path = "crates/reclaim-web", version = "0.1.2" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
jwalk = "0.9"
rayon = "1.10"
dashmap = "6"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
trash = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
glob = "0.3"
libc = "0.2"
humantime = "2"
num_cpus = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

# dev
tempfile = "3"
assert_cmd = "2"
predicates = "3"
rstest = "0.23"
insta = { version = "1", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
