# Licence and advisory policy. A tool people install with `brew install` should
# not quietly ship a copyleft or unmaintained dependency.

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained but sound, and only reaches us as a build-time
    # proc-macro of ratatui 0.29. Drop this once ratatui no longer pulls it in.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro, transitive via ratatui" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
